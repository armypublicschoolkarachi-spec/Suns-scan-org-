<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun Scan Studio — Sun Scan</title><link rel="stylesheet" href="styles.css"></head><body data-page="admin"><div id="header"></div><main class="wrap"><small>SUN SCAN STUDIO</small><h1>Release <em>manager.</em></h1><p class="muted">Local demo dashboard. Changes are stored in this browser, not published to a server.</p><div id="stats" class="stats"></div><div class="admin-layout"><form class="form" id="add"><h2>Add a title</h2><label>Title<input id="new-title" required></label><label>Type<select id="new-type"><option>Manhwa</option><option>Manga</option><option>Manhua</option><option>Novel</option></select></label><label>Status<select id="new-status"><option>Ongoing</option><option>Completed</option><option>Hiatus</option><option>Dropped</option></select></label><label>Genres (comma separated)<input id="new-genres"></label><label>Synopsis<textarea id="new-desc" rows="3"></textarea></label><button class="btn">Add title</button><p id="msg"></p></form><div class="form"><h2>Catalogue</h2><div id="admin-list"></div><hr><h2>Add chapter</h2><label>Series<select id="chapter-series"></select></label><label>Chapter number<input id="chapter-number" required></label><button class="btn" id="add-chapter">Add chapter</button><p id="chapter-msg"></p></div></div></main><div id="footer"></div><script src="app.js"></script></body></html>
